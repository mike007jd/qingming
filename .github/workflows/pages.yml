name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: false
      - name: Download only published scene assets
        run: >-
          git lfs pull
          --include="public/runtime/city.soa.bin.gz,assets/Qingming_Details.glb,assets/Qingming_Vessels.glb,assets/Qingming_LOD.glb,assets/Qingming_Auto_Details.glb"
          --exclude=""
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: actions/configure-pages@v5
      - run: npm run build:pages
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
